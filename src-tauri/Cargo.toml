[package]
name = "ntfy_app"
version = "0.4.0"
authors = ["rubixvi"]
description = "Desktop client for ntfy.sh and self-hosted ntfy instances on Windows, Linux, and macOS. Built with Rust, Tauri, and Next.js."
license = "MIT"
repository = "https://github.com/rubix-studios-pty-ltd/ntfy-app"
edition = "2024"
rust-version = "1.99.1"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[lib]
name = "ntfy_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.22"
chrono = "0.4.45"
futures-util = "0.3.34"
getrandom = "0.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
sanitize-filename = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
system_shutdown = "4.1.0"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2.5.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
xcap = "0.9.8"
zeroize = { version = "1.9", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.7"
volumecontrol = "0.1.4"

[target.'cfg(target_os = "macos")'.dependencies]
volumecontrol = "0.1.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
incremental = false
