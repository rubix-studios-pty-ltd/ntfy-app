[package]
name = "ntfy_app"
version = "0.3.4"
authors = ["rubixvi"]
description = "Desktop client for ntfy.sh and self-hosted ntfy instances on Windows, Linux, and macOS. Built with Rust, Tauri, and Next.js."
license = "MIT"
repository = "https://github.com/rubix-studios-pty-ltd/ntfy-app"
edition = "2024"
rust-version = "1.99.0"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[lib]
name = "ntfy_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
futures-util = "0.3.34"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-window-state = "2.5.0"
tokio = { version = "1.53.3", features = ["sync", "time"] }
chrono = "0.4.45"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sanitize-filename = "0.6"
system_shutdown = "4.1.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
uuid = { version = "1.28.0", features = ["v4"] }
xcap = "0.9.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
volumecontrol = "0.1.4"

[target.'cfg(target_os = "macos")'.dependencies]
volumecontrol = "0.1.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.0"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
incremental = false
